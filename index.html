<!DOCTYPE html>

<head>

<style>
  /* ============ 页面整体样式 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 20% 0%, #251a52 0%, #100f2c 55%, #0b0a1f 100%);

  /* 顶部标题 */
  header {
    text-align: center;
    padding: 48px 20px 30px;
  }
  header h1 {
    font-size: 42px;
    background: linear-gradient(90deg, #b197fc, #74c0fc);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
  }
  header p {
    margin-top: 12px;
    color: #8b93bd;
    font-size: 15px;
  }

  /* 游戏卡片网格 */
  main.grid {
    max-width: 1060px;
    margin: 0 auto;
    padding: 10px 24px 60px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  @media (max-width: 900px) { main.grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { main.grid { grid-template-columns: 1fr; } }

  .card {
    background: rgba(26, 29, 58, .85);
    border: 1px solid #2b2f55;
    border-radius: 18px;
    padding: 26px 22px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: #7048e8;
    box-shadow: 0 12px 30px rgba(112, 72, 232, .28);
  }
  .card-icon {
    font-size: 44px;
    line-height: 1;
  }
  .card-title {
    font-size: 21px;
    font-weight: bold;
  }
  .card-tag {
    display: inline-block;
    align-self: flex-start;
    font-size: 12px;
    padding: 3px 12px;
    border-radius: 20px;
    background: rgba(112, 72, 232, .22);
    color: #b197fc;
  }
  .card-desc {
    font-size: 13.5px;
    color: #9aa3d4;
    line-height: 1.7;
    flex: 1;

    font-size: 14px;

  }

    text-align: center;
    color: #555c85;
    font-size: 13px;

    display: flex;
    flex-direction: column;

    height: 54px;
    flex-shrink: 0;
    background: #141733;
    border-bottom: 1px solid #2b2f55;

    align-items: center;

    padding: 8px 18px;

<body>

      srcdoc 在打开游戏时才填入游戏的完整 HTML 代码。

  </div>

<script>
/* ============================================================
   9 个游戏的数据：每个游戏都是一个完整独立的 HTML 文件内容，
   原封不动地存在 html 字段里，运行时整体放进 iframe。
   ============================================================ */
var GAMES = [

  html: `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>打地鼠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #1a1d3a, #2d1b4e);
    min-height: 100vh;

    flex-direction: column;
    align-items: center;

  h1 { font-size: 32px; margin-bottom: 10px; letter-spacing: 4px; }

  .hole.hit .mole { transform: translateX(-50%) scale(.6); opacity: .4; }
  .start-btn {
    margin-top: 24px;
    padding: 12px 36px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #7048e8, #4263eb);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(112,72,232,.4);
  }
  .start-btn:hover { transform: translateY(-2px); }
  .over {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    font-size: 24px;
  }
  .over.show { display: flex; }
  .over h2 { font-size: 40px; color: #ffd43b; }
</style>
</head>
<body>
  <h1>🔨 打地鼠</h1>
  <div class="info">
    <div>得分：<span id="score">0</span></div>
    <div>时间：<span id="time">30</span>s</div>
  </div>
  <div class="board" id="board"></div>
  <button class="start-btn" id="startBtn">开始游戏</button>

  <div class="over" id="over">
    <h2>时间到！</h2>
    <p>你的得分：<span id="finalScore" style="color:#ffd43b;font-weight:bold;">0</span></p>
    <button class="start-btn" onclick="restart()">再玩一次</button>
  </div>

<script>
  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const over = document.getElementById('over');
  const startBtn = document.getElementById('startBtn');

  let score = 0, timeLeft = 30, timer = null, moleTimer = null, running = false;

  // 生成 9 个洞
  for (let i = 0; i < 9; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    hole.innerHTML = '<div class="mole">🐹</div>';
    hole.addEventListener('click', () => whack(hole));
    board.appendChild(hole);
  }

  function whack(hole) {
    if (!running || !hole.classList.contains('up') || hole.classList.contains('hit')) return;
    score++;
    scoreEl.textContent = score;
    hole.classList.add('hit');
    setTimeout(() => hole.classList.remove('hit', 'up'), 120);
  }

  function popMole() {
    const holes = document.querySelectorAll('.hole');
    // 随机选一个还没冒出地鼠的洞
    const free = Array.from(holes).filter(h => !h.classList.contains('up'));
    if (free.length === 0) return;
    const hole = free[Math.floor(Math.random() * free.length)];
    hole.classList.add('up');
    // 地鼠冒出来 0.6~1 秒后自己缩回去
    const dur = 600 + Math.random() * 400;
    setTimeout(() => hole.classList.remove('up'), dur);
  }

  function startGame() {
    score = 0;
    timeLeft = 30;
    scoreEl.textContent = 0;
    timeEl.textContent = 30;
    over.classList.remove('show');
    startBtn.style.display = 'none';
    running = true;

    timer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);

    // 每隔 0.5 秒冒一只地鼠
    moleTimer = setInterval(popMole, 500);
  }

  function endGame() {
    running = false;
    clearInterval(timer);
    clearInterval(moleTimer);
    document.querySelectorAll('.hole').forEach(h => h.classList.remove('up'));
    document.getElementById('finalScore').textContent = score;
    over.classList.add('show');
    startBtn.style.display = 'block';
  }

  function restart() { startGame(); }

  startBtn.addEventListener('click', startGame);
<\/script>
</body>
</html>`
},

/* ---------------- 游戏 2：2048 ---------------- */
{

  desc: '方向键移动方块，相同数字相撞合并，合成 2048 即获胜！',
  color: '#f59f00',
  html: `<!DOCTYPE html>

  .n256  { background: #edcc61; color: #f9f6f2; font-size: 26px; }
  .n512  { background: #edc850; color: #f9f6f2; font-size: 26px; }
  .n1024 { background: #edc53f; color: #f9f6f2; font-size: 20px; }

  .tip { margin-top: 16px; font-size: 14px; color: #8f7a66; }
  .restart {

  .overlay h2 { font-size: 40px; color: #776e65; }
</style>
</head>
<body>
  <h1>2048</h1>
  <div class="info">
    <div class="score-box"><div class="label">分数</div><div class="val" id="score">0</div></div>
    <div class="score-box"><div class="label">最高</div><div class="val" id="best">0</div></div>
  </div>
  <div class="board" id="board">
    <div class="overlay" id="overlay">
      <h2 id="overText">游戏结束</h2>
      <button class="restart" onclick="init()">再来一局</button>
    </div>
  </div>
  <p class="tip">用 ↑ ↓ ← → 方向键移动方块，相同数字合并，合成 2048 获胜！</p>
  <button class="restart" onclick="init()">重新开始</button>

<script>
  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overText = document.getElementById('overText');

  let grid, score, best = 0, over = false, won = false;
  const cells = [];

  // 创建 16 个格子
  for (let i = 0; i < 16; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    board.appendChild(c);
    cells.push(c);
  }

  function init() {
    grid = Array(16).fill(0);
    score = 0;
    over = false;
    won = false;
    overlay.classList.remove('show');
    addRandom();
    addRandom();
    render();
  }

  // 随机在空格子里放一个 2（90%）或 4（10%）
  function addRandom() {
    const empty = [];
    for (let i = 0; i < 16; i++) if (grid[i] === 0) empty.push(i);
    if (empty.length === 0) return;
    const idx = empty[Math.floor(Math.random() * empty.length)];
    grid[idx] = Math.random() < 0.9 ? 2 : 4;
  }

  function render() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    for (let i = 0; i < 16; i++) {
      const v = grid[i];
      cells[i].className = 'cell' + (v ? ' n' + v : '');
      cells[i].textContent = v || '';
    }
  }

  // 把一行/列向左压缩合并，返回新数组和获得的分数
  function slide(row) {
    let arr = row.filter(v => v);       // 去掉 0
    let gained = 0;
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        gained += arr[i];
        if (arr[i] === 2048 && !won) { won = true; }
        arr.splice(i + 1, 1);
      }
    }
    while (arr.length < 4) arr.push(0);
    return { row: arr, gained };
  }

  function move(dir) {
    if (over) return;
    const before = grid.join(',');
    let totalGain = 0;

    // 把 4x4 网格按方向拆成 4 行来处理
    for (let i = 0; i < 4; i++) {
      let idx;
      if (dir === 'left')  idx = [i*4, i*4+1, i*4+2, i*4+3];
      if (dir === 'right') idx = [i*4+3, i*4+2, i*4+1, i*4];
      if (dir === 'up')    idx = [i, i+4, i+8, i+12];
      if (dir === 'down')  idx = [i+12, i+8, i+4, i];

      const row = idx.map(p => grid[p]);
      const { row: nr, gained } = slide(row);
      totalGain += gained;
      idx.forEach((p, j) => grid[p] = nr[j]);
    }

    // 如果有变化，加分并生成新方块
    if (grid.join(',') !== before) {
      score += totalGain;
      if (score > best) best = score;
      addRandom();
      render();
      checkOver();
    }
  }

  function checkOver() {
    if (won) {
      overText.textContent = '🎉 你赢了！合成 2048！';
      overlay.classList.add('show');
      over = true;
      return;
    }
    // 还有空格就没结束
    if (grid.includes(0)) return;
    // 检查是否还能合并
    for (let i = 0; i < 16; i++) {
      const v = grid[i];
      if ((i + 1) % 4 !== 0 && grid[i+1] === v) return;
      if (i + 4 < 16 && grid[i+4] === v) return;
    }
    overText.textContent = '游戏结束';
    overlay.classList.add('show');
    over = true;
  }

  document.addEventListener('keydown', e => {
    const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
  });

  init();
<\/script>
</body>
</html>`
},

  // 简单 AI：优先赢，其次堵，否则随机
  function aiMove() {
    if (over) return;
    let move = findWin('O') ?? findWin('X') ?? randomEmpty();
    boardState[move] = 'O';
    cells[move].textContent = 'O';
    cells[move].classList.add('o', 'taken');
    if (checkWin('O')) return end('电脑赢了！🤖', 'O');
    if (boardState.every(v => v)) return end('平局！', null);
    statusEl.textContent = '轮到你了，下 X';
  }

  function findWin(p) {
    for (const [a, b, c] of WINS) {
      const line = [boardState[a], boardState[b], boardState[c]];
      if (line.filter(v => v === p).length === 2 && line.includes('')) {
        return [a, b, c][line.indexOf('')];
      }
    }
    return null;
  }

  function randomEmpty() {
    const e = boardState.map((v, i) => v === '' ? i : -1).filter(i => i >= 0);
    return e[Math.floor(Math.random() * e.length)];
  }

  function checkWin(p) {
    for (const line of WINS) {
      if (line.every(i => boardState[i] === p)) {
        line.forEach(i => cells[i].classList.add('win'));
        return true;
      }
    }
    return false;
  }

  function end(msg, winner) {
    over = true;
    statusEl.textContent = msg;
    if (winner === 'X') { px++; pxEl.textContent = px; }
    if (winner === 'O') { po++; poEl.textContent = po; }
  }

  function reset() { init(); }
  init();
<\/script>
</body>

    opened = Array.from({length: H}, () => Array(W).fill(false));
    flagged = Array.from({length: H}, () => Array(W).fill(false));
    over = false;
    firstClick = true;
    seconds = 0;
    timeEl.textContent = 0;
    overMsg.textContent = '';
    overMsg.className = 'over';
    minesEl.textContent = MINE_COUNT;

    for (let y = 0; y < H; y++) {
      grid[y] = [];
      for (let x = 0; x < W; x++) grid[y][x] = 0;
    }
    render();
  }

  function placeMines(safeX, safeY) {
    let placed = 0;
    while (placed < MINE_COUNT) {
      const x = Math.floor(Math.random() * W);
      const y = Math.floor(Math.random() * H);
      // 不在第一次点击的位置及其周围布雷
      if (Math.abs(x - safeX) <= 1 && Math.abs(y - safeY) <= 1) continue;
      if (grid[y][x] === -1) continue;
      grid[y][x] = -1;
      placed++;
    }
    // 计算每个格子周围的地雷数
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (grid[y][x] === -1) continue;
        let n = 0;
        for (let dy = -1; dy <= 1; dy++)
          for (let dx = -1; dx <= 1; dx++) {
            const nx = x+dx, ny = y+dy;
            if (nx>=0 && nx<W && ny>=0 && ny<H && grid[ny][nx] === -1) n++;
          }
        grid[y][x] = n;
      }
    }

      for (let x = 0; x < W; x++) {

          if (grid[y][x] === -1) { c.classList.add('mine'); c.textContent = '💣'; }
          else if (grid[y][x] > 0) { c.textContent = grid[y][x]; c.classList.add('n' + grid[y][x]); }

          c.classList.add('flag');
        }
        c.addEventListener('click', () => open(x, y));
        c.addEventListener('contextmenu', e => { e.preventDefault(); toggleFlag(x, y); });

    if (grid[y][x] === -1) return gameOver(false);

      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++) {
          const nx = x+dx, ny = y+dy;
          if (nx>=0 && nx<W && ny>=0 && ny<H && !opened[ny][nx]) open(nx, ny);
        }
    }
    render();
    checkWin();
  }

  function toggleFlag(x, y) {
    if (over || opened[y][x]) return;
    flagged[y][x] = !flagged[y][x];
    const flagCount = flagged.flat().filter(Boolean).length;
    minesEl.textContent = MINE_COUNT - flagCount;
    render();
  }

  function checkWin() {
    let unopened = 0;
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++)
        if (!opened[y][x]) unopened++;
    if (unopened === MINE_COUNT) gameOver(true);
  }

    over = true;
    clearInterval(timer);

    for (let y = 0; y < H; y++)

    overMsg.className = 'over ' + (won ? 'win' : 'lose');
  }

  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timeEl = document.getElementById('time');
  const pairsEl = document.getElementById('pairs');

  // 8 种动物图案，每种出现 2 次
  const EMOJIS = ['🐶','🐱','🦊','🐼','🐸','🐵','🐰','🦁'];

  function shuffle(arr) {

      [arr[i], arr[j]] = [arr[j], arr[i]];

    if (lock || cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

    if (!started) {
      started = true;
      timer = setInterval(() => { seconds++; timeEl.textContent = seconds; }, 1000);
    }

    cardEl.classList.add('flipped');
    flipped.push({ i, el: cardEl });

    // 翻开第二张时判定是否相同
    if (flipped.length === 2) {
      moves++;
      movesEl.textContent = moves;
      lock = true;   // 锁定，等判定结束才能继续点

      const [a, b] = flipped;

  }
  h1 { font-size: 28px; margin-bottom: 12px; color: #38bdf8; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; }
  canvas {

    border: 2px solid #38bdf8;
    border-radius: 8px;

    font-weight: bold;
    cursor: pointer;
  }
  button:hover { opacity: .85; }
</style>
</head>
<body>
  <h1>🟦 俄罗斯方块</h1>
  <div class="wrap">
    <canvas id="game" width="260" height="520"></canvas>
    <div class="side">
      得分：<b id="score">0</b><br>
      消行：<b id="lines">0</b><br>
      等级：<b id="level">1</b><br>
      <button onclick="restart()">重新开始</button>
    </div>
  </div>
  <p class="tip">← → 左右移动 ｜ ↑ 旋转 ｜ ↓ 加速下落 ｜ 空格直接落底<br>先点一下游戏区域获取键盘焦点</p>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const COLS = 10, ROWS = 20, SIZE = 26;

  // 7 种经典方块形状（1 表示有方块）
  const SHAPES = {
    I: [[1,1,1,1]],
    O: [[1,1],[1,1]],
    T: [[0,1,0],[1,1,1]],
    S: [[0,1,1],[1,1,0]],
    Z: [[1,1,0],[0,1,1]],
    J: [[1,0,0],[1,1,1]],
    L: [[0,0,1],[1,1,1]]
  };
  // 每种方块的颜色
  const COLORS = {
    I: '#22d3ee', O: '#facc15', T: '#c084fc',
    S: '#4ade80', Z: '#f87171', J: '#60a5fa', L: '#fb923c'
  };

  let grid;          // 20 行 10 列的场地，存颜色或 null
  let piece;         // 当前方块 { shape, color, x, y }
  let score, lines, level;
  let over;
  let dropInterval;  // 下落间隔（毫秒），等级越高越快
  let lastTime, dropTimer, rafId;

  function newGrid() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  // 随机生成一个新方块，从顶部中间出现
  function spawn() {
    const keys = Object.keys(SHAPES);
    const name = keys[Math.floor(Math.random() * keys.length)];
    const shape = SHAPES[name].map(row => row.slice());
    piece = {
      shape: shape,
      color: COLORS[name],
      x: Math.floor((COLS - shape[0].length) / 2),
      y: 0
    };
    // 一出现就碰撞，说明顶部堆满了 → 游戏结束
    if (collide(piece.shape, piece.x, piece.y)) gameOver();
  }

  // 检查形状放在 (x,y) 是否会碰撞（出界或压到已有方块）
  function collide(shape, x, y) {
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (!shape[r][c]) continue;
        const nx = x + c, ny = y + r;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return true;   // 左右或底部出界
        if (ny >= 0 && grid[ny][nx]) return true;              // 压到方块
      }
    }
    return false;
  }

  // 把当前方块固定到场地里
  function merge() {
    piece.shape.forEach((row, r) => {
      row.forEach((v, c) => {
        if (v && piece.y + r >= 0) grid[piece.y + r][piece.x + c] = piece.color;
      });
    });
  }

  // 消掉填满的整行
  function clearLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r].every(v => v)) {
        grid.splice(r, 1);                    // 删除这一行
        grid.unshift(Array(COLS).fill(null)); // 顶部补一空行
        cleared++;
        r++;                                   // 同一位置要重新检查
      }
    }
    if (cleared > 0) {
      // 一次消的行越多，得分越高（再乘上等级）
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      level = Math.floor(lines / 10) + 1;                 // 每消 10 行升一级
      dropInterval = Math.max(120, 800 - (level - 1) * 70); // 升级后下落更快
      updateInfo();
    }
  }

  function move(dx) {
    if (!collide(piece.shape, piece.x + dx, piece.y)) piece.x += dx;
  }

  // 下落一格；落到底时固定并生成新方块
  function drop() {
    if (!collide(piece.shape, piece.x, piece.y + 1)) {
      piece.y++;
    } else {
      merge();
      clearLines();
      spawn();
    }
    dropTimer = 0;
  }

  // 空格：直接落到底
  function hardDrop() {
    while (!collide(piece.shape, piece.x, piece.y + 1)) piece.y++;
    drop();
  }

  // 旋转矩阵 90 度
  function rotateMatrix(m) {
    const rows = m.length, cols = m[0].length;
    const result = Array.from({ length: cols }, () => Array(rows).fill(0));
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        result[c][rows - 1 - r] = m[r][c];
    return result;
  }

  // 旋转，如果靠墙就尝试左右挪一下（简单的"墙踢"）
  function rotatePiece() {
    const rotated = rotateMatrix(piece.shape);
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      if (!collide(rotated, piece.x + k, piece.y)) {
        piece.shape = rotated;
        piece.x += k;
        return;
      }
    }
  }

  function draw() {
    // 背景
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格线（淡淡的）
    ctx.strokeStyle = 'rgba(148,163,184,.12)';
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x*SIZE, 0); ctx.lineTo(x*SIZE, ROWS*SIZE); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y*SIZE); ctx.lineTo(COLS*SIZE, y*SIZE); ctx.stroke();
    }

    // 已固定的方块
    grid.forEach((row, r) => {
      row.forEach((color, c) => {
        if (color) drawBlock(c, r, color);
      });
    });

    // 当前正在下落的方块
    piece.shape.forEach((row, r) => {
      row.forEach((v, c) => {
        if (v) drawBlock(piece.x + c, piece.y + r, piece.color);
      });
    });

    if (over) {
      ctx.fillStyle = 'rgba(0,0,0,.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 32px "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.fillText('游戏结束', canvas.width/2, canvas.height/2 - 10);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '16px "Microsoft YaHei"';
      ctx.fillText('点击"重新开始"再来一局', canvas.width/2, canvas.height/2 + 26);
    }
  }

  // 画一个带高光的小方块
  function drawBlock(c, r, color) {
    const x = c * SIZE, y = r * SIZE;
    ctx.fillStyle = color;
    ctx.fillRect(x + 1, y + 1, SIZE - 2, SIZE - 2);
    // 高光边框，让方块有立体感
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(x + 1, y + 1, SIZE - 2, 3);
    ctx.fillRect(x + 1, y + 1, 3, SIZE - 2);
  }

  function updateInfo() {
    document.getElementById('score').textContent = score;
    document.getElementById('lines').textContent = lines;
    document.getElementById('level').textContent = level;
  }

  function gameOver() {
    over = true;
    cancelAnimationFrame(rafId);
    draw();
  }

  // 主循环：根据经过的时间决定什么时候自动下落
  function loop(time) {
    if (over) return;
    const delta = time - lastTime;
    lastTime = time;
    dropTimer += delta;
    if (dropTimer > dropInterval) drop();
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function start() {
    grid = newGrid();
    score = 0; lines = 0; level = 1;
    over = false;
    dropInterval = 800;
    dropTimer = 0;
    lastTime = performance.now();
    updateInfo();
    spawn();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function restart() { start(); }

  // 键盘控制（按方向键时阻止页面滚动）
  document.addEventListener('keydown', e => {
    if (over) return;
    switch (e.key) {
      case 'ArrowLeft':  e.preventDefault(); move(-1); break;
      case 'ArrowRight': e.preventDefault(); move(1); break;
      case 'ArrowDown':  e.preventDefault(); drop(); break;
      case 'ArrowUp':    e.preventDefault(); rotatePiece(); break;
      case ' ':          e.preventDefault(); hardDrop(); break;
    }
  });

  start();
<\/script>
</body>
</html>`
},

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const GROUND = H - 46;   // 篮子所在的高度

    ctx.lineTo(basket.x + basket.w/2, GROUND);
    ctx.lineTo(basket.x + basket.w/2 - 12, GROUND + basket.h);
    ctx.lineTo(basket.x - basket.w/2 + 12, GROUND + basket.h);

    ctx.strokeStyle = '#92400e';

    ctx.beginPath();
    ctx.arc(basket.x, GROUND, basket.w/2 - 6, Math.PI, 0);

    if (flashTime > 0) {
      ctx.fillStyle = 'rgba(239,68,68,' + (flashTime / 250) * 0.45 + ')';

      ctx.fillText('最终得分：' + score, W/2, H/2 + 24);

  }

  function loop(time) {

    lastTime = time;
    if (flashTime > 0) flashTime -= dt;

    rafId = requestAnimationFrame(loop);

  function gameOver() {
    over = true;
    cancelAnimationFrame(rafId);
    draw();
  }

  function start() {
    init();
    lastTime = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);

    basket.x = (e.clientX - rect.left) * (W / rect.width);

  canvas {
    border: 2px solid #2e7d32;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    cursor: pointer;
  }
  .tip { margin-top: 12px; font-size: 14px; color: #1b5e20; }
</style>
</head>
<body>
  <h1>🐤 飞扬小鸟</h1>
  <canvas id="game" width="360" height="520"></canvas>
  <p class="tip">点击画面或按空格让小鸟往上飞，松开就会掉下来</p>

<script>
  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var GROUND = 462;           // 地面高度

  var bird, pipes, score, state, spawnAcc, lastTime, best = 0;
  // state 有三种：ready（等待开始）/ play（进行中）/ over（结束）

  function reset() {
    bird = { x: 90, y: 240, vy: 0, r: 14 };
    pipes = [];
    score = 0;
    spawnAcc = 0;
    state = 'ready';
  }

  // 拍翅膀：往上冲一下
  function flap() {
    if (state === 'ready') { state = 'play'; lastTime = performance.now(); }
    if (state === 'play') bird.vy = -6.6;
    else if (state === 'over') reset();
  }

  // 生成一对上下水管，中间留 GAP 像素的缝
  function spawnPipe() {
    var gapY = 80 + Math.random() * (GROUND - 260);
    pipes.push({ x: W, gapY: gapY, passed: false });
  }

  function update(dt) {
    var f = dt / 16.7;   // 时间系数：以 60 帧为标准

    // 小鸟始终受重力影响
    bird.vy += 0.32 * f;
    bird.y += bird.vy * f;

    // 定时生成水管（约每 1.6 秒一对）
    spawnAcc += dt;
    if (spawnAcc > 1600) { spawnPipe(); spawnAcc = 0; }

    for (var i = pipes.length - 1; i >= 0; i--) {
      var p = pipes[i];
      p.x -= 2.7 * f;
      // 小鸟越过水管右边缘时得分
      if (!p.passed && p.x + 62 < bird.x) { p.passed = true; score++; }
      if (p.x < -70) pipes.splice(i, 1);
    }

    checkHit();
  }

  // 碰撞判定：地面、天花板、水管
  function checkHit() {
    if (bird.y + bird.r >= GROUND || bird.y - bird.r <= 0) return gameOver();
    for (var i = 0; i < pipes.length; i++) {
      var p = pipes[i];
      if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + 62) {
        if (bird.y - bird.r < p.gapY || bird.y + bird.r > p.gapY + 152) return gameOver();
      }
    }
  }

  function gameOver() {
    state = 'over';
    if (score > best) best = score;
  }

  function draw() {
    // 天空
    ctx.fillStyle = '#7fc8f8';
    ctx.fillRect(0, 0, W, H);

    // 远景云
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.arc(60, 90, 22, 0, 7); ctx.arc(86, 84, 28, 0, 7); ctx.arc(112, 94, 20, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(250, 150, 18, 0, 7); ctx.arc(272, 144, 24, 0, 7); ctx.arc(294, 152, 16, 0, 7); ctx.fill();

    // 水管
    ctx.fillStyle = '#43a047';
    pipes.forEach(function (p) {
      ctx.fillRect(p.x, 0, 62, p.gapY);                                 // 上管
      ctx.fillRect(p.x - 3, p.gapY - 22, 68, 22);                       // 上管口
      ctx.fillRect(p.x, p.gapY + 152, 62, GROUND - p.gapY - 152);       // 下管
      ctx.fillRect(p.x - 3, p.gapY + 152, 68, 22);                      // 下管口
    });

    // 地面
    ctx.fillStyle = '#8d6e63';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#66bb6a';
    ctx.fillRect(0, GROUND, W, 8);

    // 小鸟（身体 + 眼睛 + 嘴巴）
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(Math.max(-0.4, Math.min(0.9, bird.vy * 0.07)));  // 根据速度倾斜
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(5, -5, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(7, -5, 2.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff7043';
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(22, 2); ctx.lineTo(12, 6); ctx.fill();
    ctx.restore();

    // 分数
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,.4)';
    ctx.lineWidth = 4;
    ctx.font = 'bold 42px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    if (state !== 'ready') {
      ctx.strokeText(score, W/2, 70);
      ctx.fillText(score, W/2, 70);
    }

    // 提示文字
    ctx.font = 'bold 24px "Microsoft YaHei"';
    if (state === 'ready') {
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillText('点击开始', W/2, 200);
      ctx.font = '16px "Microsoft YaHei"';
      ctx.fillText('穿过水管得 1 分', W/2, 234);
    }
    if (state === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff5252';
      ctx.font = 'bold 40px "Microsoft YaHei"';
      ctx.fillText('游戏结束', W/2, 220);
      ctx.fillStyle = '#fff';
      ctx.font = '20px "Microsoft YaHei"';
      ctx.fillText('得分：' + score + '　最高：' + best, W/2, 262);
      ctx.font = '17px "Microsoft YaHei"';
      ctx.fillText('点击画面重新开始', W/2, 306);
    }
  }

  function loop(t) {
    var dt = Math.min(40, t - lastTime);
    lastTime = t;
    if (state === 'play') update(dt);
    else if (state === 'ready') { bird.y = 240 + Math.sin(t/300) * 8; }  // 待机时上下浮动
    draw();
    requestAnimationFrame(loop);
  }

  cv.addEventListener('mousedown', flap);
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ') { e.preventDefault(); flap(); }
  });

  reset();
  lastTime = performance.now();
  requestAnimationFrame(loop);
<\/script>
</body>
</html>`
},

  color: '#e8590c',
  html: `<!DOCTYPE html>
<html lang="zh-CN">

<title>飞机大战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  }

</style>
</head>
<body>
  <h1>✈️ 飞机大战</h1>
  <div class="info">
    <div>得分：<b id="score">0</b></div>
    <div>生命：<b id="lives">❤️❤️❤️</b></div>
  </div>
  <canvas id="game" width="420" height="600"></canvas>
  <p class="tip">移动鼠标控制飞机（也可用 ← → 键），子弹自动发射</p>

<script>
  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;

  var player, bullets, enemies, particles, score, lives, over;
  var fireAcc, enemyAcc, lastTime, rafId;
  var keys = { left: false, right: false };
  var stars = [];   // 背景星星

  // 初始化星空
  for (var s = 0; s < 60; s++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H, v: 0.5 + Math.random()*2, r: Math.random()*1.6 });
  }

  function init() {
    player = { x: W/2, y: H - 70, w: 38, h: 42, speed: 7 };
    bullets = [];
    enemies = [];
    particles = [];
    score = 0;
    lives = 3;
    over = false;
    fireAcc = 0;
    enemyAcc = 0;
    updateUI();
  }

  function updateUI() {
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = lives > 0 ? '❤️'.repeat(lives) : '💔';
  }

  // 爆炸粒子
  function boom(x, y, color) {
    for (var i = 0; i < 12; i++) {
      var a = Math.random() * Math.PI * 2;
      particles.push({ x: x, y: y, vx: Math.cos(a)*(1+Math.random()*3), vy: Math.sin(a)*(1+Math.random()*3), life: 26, color: color });
    }
  }

  function update(dt) {
    var f = dt / 16.7;

    // 玩家移动（键盘）
    if (keys.left) player.x -= player.speed * f;
    if (keys.right) player.x += player.speed * f;
    player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));

    // 自动开火（约每 180ms 一发）
    fireAcc += dt;
    if (fireAcc > 180) {
      fireAcc = 0;
      bullets.push({ x: player.x, y: player.y - 22 });
    }

    // 生成敌机（分数越高出现越快）
    enemyAcc += dt;
    if (enemyAcc > Math.max(320, 800 - score * 4)) {
      enemyAcc = 0;
      enemies.push({ x: 24 + Math.random()*(W-48), y: -30, w: 36, h: 30, vy: 2 + Math.random()*1.8 + score/300 });
    }

    // 子弹上飞
    for (var i = bullets.length - 1; i >= 0; i--) {
      bullets[i].y -= 10 * f;
      if (bullets[i].y < -10) bullets.splice(i, 1);
    }

    // 敌机下落 + 碰撞
    for (var j = enemies.length - 1; j >= 0; j--) {
      var e = enemies[j];
      e.y += e.vy * f;

      // 子弹击中敌机
      var killed = false;
      for (var k = bullets.length - 1; k >= 0; k--) {
        var b = bullets[k];
        if (Math.abs(b.x - e.x) < e.w/2 && Math.abs(b.y - e.y) < e.h/2) {
          bullets.splice(k, 1);
          enemies.splice(j, 1);
          boom(e.x, e.y, '#f87171');
          score += 10;
          updateUI();
          killed = true;
          break;
        }
      }
      if (killed) continue;

      // 敌机撞到玩家
      if (Math.abs(e.x - player.x) < (e.w + player.w)/2 - 8 &&
          Math.abs(e.y - player.y) < (e.h + player.h)/2 - 8) {
        enemies.splice(j, 1);
        boom(player.x, player.y, '#fbbf24');
        lives--;
        updateUI();
        if (lives <= 0) gameOver();
        continue;
      }

      // 飞出屏幕
      if (e.y > H + 30) enemies.splice(j, 1);
    }

    // 粒子动画
    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx * f;
      pt.y += pt.vy * f;
      pt.life--;
      if (pt.life <= 0) particles.splice(p, 1);
    }

    // 星空滚动
    stars.forEach(function (st) {
      st.y += st.v * f;
      if (st.y > H) { st.y = 0; st.x = Math.random() * W; }
    });
  }

  function draw() {
    ctx.fillStyle = '#0d1426';
    ctx.fillRect(0, 0, W, H);

    // 星星
    ctx.fillStyle = '#cbd5e1';
    stars.forEach(function (st) {
      ctx.globalAlpha = .4 + st.r/3;
      ctx.fillRect(st.x, st.y, st.r, st.r);
    });
    ctx.globalAlpha = 1;

    // 子弹
    ctx.fillStyle = '#fde047';
    bullets.forEach(function (b) { ctx.fillRect(b.x - 2, b.y - 8, 4, 14); });

    // 敌机（倒三角）
    enemies.forEach(function (e) {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(e.x, e.y + e.h/2);
      ctx.lineTo(e.x - e.w/2, e.y - e.h/2);
      ctx.lineTo(e.x + e.w/2, e.y - e.h/2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#7f1d1d';
      ctx.fillRect(e.x - 6, e.y - 12, 12, 6);
    });

    // 玩家飞机（正三角 + 机翼）
    ctx.fillStyle = '#60a5fa';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - player.h/2);
    ctx.lineTo(player.x - player.w/2, player.y + player.h/2);
    ctx.lineTo(player.x + player.w/2, player.y + player.h/2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1d4ed8';
    ctx.fillRect(player.x - 5, player.y + player.h/2 - 4, 10, 10);

    // 爆炸粒子
    particles.forEach(function (pt) {
      ctx.globalAlpha = pt.life / 26;
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    });
    ctx.globalAlpha = 1;

    if (over) {
      ctx.fillStyle = 'rgba(0,0,0,.7)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 38px "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.fillText('飞机被击落！', W/2, H/2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = '20px "Microsoft YaHei"';
      ctx.fillText('最终得分：' + score, W/2, H/2 + 20);
      ctx.font = '16px "Microsoft YaHei"';
      ctx.fillText('点击画面重新开始', W/2, H/2 + 58);
    }
  }

  function loop(t) {
    var dt = Math.min(40, t - lastTime);
    lastTime = t;
    if (!over) update(dt);
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function gameOver() { over = true; }

  cv.addEventListener('mousemove', function (e) {
    var rect = cv.getBoundingClientRect();
    player.x = (e.clientX - rect.left) * (W / rect.width);
    player.y = (e.clientY - rect.top) * (H / rect.height);
    player.y = Math.max(H/2, Math.min(H - 40, player.y));
  });
  cv.addEventListener('mousedown', function () { if (over) start(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
  });
  document.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  function start() {
    init();
    lastTime = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
  start();
<\/script>
</body>
</html>`
},

    border: none;
    border-radius: 8px;
    background: #a1887f;
    color: #fff;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <h1>⚫ 五子棋 ⚪</h1>
  <div class="status" id="status"></div>
  <canvas id="board" width="450" height="450"></canvas>
  <button onclick="init()">重新开始</button>

<script>
  var cv = document.getElementById('board');
  var ctx = cv.getContext('2d');
  var N = 15;          // 15 路棋盘
  var CELL = 30;       // 每格 30 像素
  var OFFSET = 15;     // 第一条线距边缘的距离

  var board, current, over, winLine = null;

  function init() {
    // 棋盘数据：0 空，1 黑，2 白
    board = [];
    for (var r = 0; r < N; r++) board.push(new Array(N).fill(0));
    current = 1;   // 黑棋先行
    over = false;
    winLine = null;
    updateStatus();
    draw();
  }

  function updateStatus() {
    var st = document.getElementById('status');
    if (over) return;
    if (current === 1) st.innerHTML = '轮到 <b class="black">●</b> 黑棋';
    else st.innerHTML = '轮到 <b class="white">●</b> 白棋';
  }

  function draw() {
    // 木纹底色
    ctx.fillStyle = '#d7a86e';
    ctx.fillRect(0, 0, cv.width, cv.height);

    // 网格线
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 1;
    for (var i = 0; i < N; i++) {
      ctx.beginPath();
      ctx.moveTo(OFFSET, OFFSET + i*CELL);
      ctx.lineTo(OFFSET + (N-1)*CELL, OFFSET + i*CELL);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(OFFSET + i*CELL, OFFSET);
      ctx.lineTo(OFFSET + i*CELL, OFFSET + (N-1)*CELL);
      ctx.stroke();
    }

    // 五个星位
    [[3,3],[11,3],[3,11],[11,11],[7,7]].forEach(function (p) {
      ctx.fillStyle = '#5d4037';
      ctx.beginPath();
      ctx.arc(OFFSET + p[0]*CELL, OFFSET + p[1]*CELL, 4, 0, 7);
      ctx.fill();
    });

    // 棋子
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        if (board[r][c]) drawStone(c, r, board[r][c]);
      }
    }

    // 获胜的五连子高亮
    if (winLine) {
      ctx.strokeStyle = '#e53935';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(OFFSET + winLine[0].c*CELL, OFFSET + winLine[0].r*CELL);
      ctx.lineTo(OFFSET + winLine[1].c*CELL, OFFSET + winLine[1].r*CELL);
      ctx.stroke();
    }
  }

  function drawStone(c, r, color) {
    var x = OFFSET + c*CELL, y = OFFSET + r*CELL;
    var g = ctx.createRadialGradient(x-4, y-4, 2, x, y, 13);
    if (color === 1) { g.addColorStop(0, '#666'); g.addColorStop(1, '#000'); }
    else { g.addColorStop(0, '#fff'); g.addColorStop(1, '#bbb'); }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, 12.5, 0, 7);
    ctx.fill();
  }

  cv.addEventListener('click', function (e) {
    if (over) return;
    var rect = cv.getBoundingClientRect();
    var x = (e.clientX - rect.left) * (cv.width / rect.width);
    var y = (e.clientY - rect.top) * (cv.height / rect.height);
    // 找到最近的交叉点
    var c = Math.round((x - OFFSET) / CELL);
    var r = Math.round((y - OFFSET) / CELL);
    if (c < 0 || c >= N || r < 0 || r >= N || board[r][c] !== 0) return;

    board[r][c] = current;
    var line = checkWin(r, c, current);
    draw();

    if (line) {
      over = true;
      winLine = line;
      draw();
      document.getElementById('status').innerHTML =
        (current === 1 ? '⚫ 黑棋' : '⚪ 白棋') + ' 五子连珠，获胜！🎉';
      return;
    }
    current = current === 1 ? 2 : 1;
    updateStatus();
  });

  // 检查刚落下的子是否形成五连：四个方向分别往两边数
  function checkWin(r, c, color) {
    var dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (var d = 0; d < dirs.length; d++) {
      var dr = dirs[d][0], dc = dirs[d][1];
      var count = 1;
      var a = { r: r, c: c }, b = { r: r, c: c };
      // 正向延伸
      var nr = r + dr, nc = c + dc;
      while (nr>=0 && nr<N && nc>=0 && nc<N && board[nr][nc] === color) {
        count++; b = { r: nr, c: nc }; nr += dr; nc += dc;
      }
      // 反向延伸
      nr = r - dr; nc = c - dc;
      while (nr>=0 && nr<N && nc>=0 && nc<N && board[nr][nc] === color) {
        count++; a = { r: nr, c: nc }; nr -= dr; nc -= dc;
      }
      if (count >= 5) return [a, b];
    }
    return null;
  }

  init();
<\/script>
</body>
</html>`
},

<script>
  /* 关卡字符含义：
     # 墙   空格 地板   @ 玩家   $ 箱子   . 目标点   * 箱子在目标上   + 玩家在目标上 */
  var LEVELS = [

    [

      '#        #',
      '#  ....  #',
      '#  $$$$  #',
      '#   @    #',
      '#        #',
      '##########'
    ],
    [
      '#########',
      '#       #',
      '# .   . #',
      '# $   $ #',
      '#       #',
      '# $   $ #',
      '# .   . #',
      '#   @   #',
      '#########'

  ];
  // 第 3 关：四角各一个目标点和箱子，利用中间空旷的通道绕到箱子下方/上方推动即可

  <h1>✊ 石头剪刀布 ✌️</h1>
  <div class="score">
    <div class="you">你胜：<b id="you">0</b></div>
    <div>平局：<b id="draw">0</b></div>
    <div class="pc">电脑胜：<b id="pc">0</b></div>
  </div>

  <div class="arena">
    <div class="hand-wrap">
      <div class="hand" id="youHand">✊</div>
      <div class="label">你</div>
    </div>
    <div class="vs">VS</div>
    <div class="hand-wrap">
      <div class="hand pc" id="pcHand">✊</div>
      <div class="label">电脑</div>
    </div>
  </div>

  <div class="result" id="result">出招吧！</div>
  <div class="choices">
    <button data-c="rock">✊</button>
    <button data-c="scissors">✌️</button>
    <button data-c="paper">✋</button>
  </div>
  <div class="streak" id="streak"></div>

<script>
  var EMOJI = { rock: '✊', scissors: '✌️', paper: '✋' };
  var NAME = { rock: '石头', scissors: '剪刀', paper: '布' };
  var CHOICES = ['rock', 'scissors', 'paper'];

  var score = { you: 0, pc: 0, draw: 0 };
  var streak = 0, maxStreak = 0;
  var busy = false;

  var youHand = document.getElementById('youHand');
  var pcHand = document.getElementById('pcHand');
  var resultEl = document.getElementById('result');
  var streakEl = document.getElementById('streak');
  var buttons = document.querySelectorAll('.choices button');

  function play(you) {
    if (busy) return;
    busy = true;
    buttons.forEach(function (b) { b.disabled = true; });
    resultEl.textContent = '出招中…';
    resultEl.style.color = '#fbcfe8';

    // 双手先一起摇（用 ✊ 模拟"石头剪刀布"的晃动）
    youHand.textContent = '✊';
    pcHand.textContent = '✊';
    var shakes = 0;
    var shakeTimer = setInterval(function () {
      shakes++;
      var up = shakes % 2 === 0;
      youHand.style.marginTop = up ? '0' : '-18px';
      pcHand.style.marginTop = up ? '0' : '-18px';
      if (shakes >= 6) {
        clearInterval(shakeTimer);
        finish(you);
      }
    }, 130);
  }

  function finish(you) {
    var pc = CHOICES[Math.floor(Math.random() * 3)];
    youHand.textContent = EMOJI[you];
    pcHand.textContent = EMOJI[pc];
    youHand.style.marginTop = '0';
    pcHand.style.marginTop = '0';

    var text;
    if (you === pc) {
      score.draw++;
      streak = 0;
      text = '平局！都出了' + NAME[you];
      resultEl.style.color = '#fde68a';
    } else if (
      (you === 'rock' && pc === 'scissors') ||
      (you === 'scissors' && pc === 'paper') ||
      (you === 'paper' && pc === 'rock')) {
      score.you++;
      streak++;
      if (streak > maxStreak) maxStreak = streak;
      text = '你赢了！' + NAME[you] + '克' + NAME[pc];
      resultEl.style.color = '#6ee7b7';
    } else {
      score.pc++;
      streak = 0;
      text = '电脑赢了！' + NAME[pc] + '克' + NAME[you];
      resultEl.style.color = '#fda4af';
    }

    resultEl.textContent = text;
    document.getElementById('you').textContent = score.you;
    document.getElementById('pc').textContent = score.pc;
    document.getElementById('draw').textContent = score.draw;
    streakEl.textContent = streak >= 2 ? '🔥 ' + streak + ' 连胜！最高 ' + maxStreak + ' 连胜'
                                       : (maxStreak > 0 ? '最高 ' + maxStreak + ' 连胜' : '');

    busy = false;
    buttons.forEach(function (b) { b.disabled = false; });
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () { play(btn.getAttribute('data-c')); });
  });
<\/script>
</body>
</html>`

  color: '#1098ad',
  html: `<!DOCTYPE html>
<html lang="zh-CN">

<title>消消乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .gem:hover { transform: scale(1.08); }

  .gem.c0 { background: #ef4444; }

  .gem.c2 { background: #facc15; }

  .gem.c4 { background: #3b82f6; }

  @keyframes pop { to { transform: scale(0); opacity: 0; } }

  button {
    margin-top: 10px;
    padding: 9px 24px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background: #06b6d4;
    color: #04202c;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <h1>💎 消消乐</h1>
  <div class="info">
    <div>得分：<b id="score">0</b></div>
    <div>连锁：<b id="chain">0</b></div>
  </div>
  <div class="board" id="board"></div>
  <button onclick="newGame()">重新开始</button>
  <p class="tip">先点一个宝石，再点它上下左右相邻的宝石进行交换<br>三个以上同色连成一线即可消除，交换后没有消除会自动换回</p>

<script>
  var N = 8;              // 8 x 8 的棋盘
  var KINDS = 6;          // 6 种颜色
  var grid;               // 二维数组，存颜色编号 0~5
  var selected = null;    // 当前选中的格子 {r,c}
  var busy = false;       // 动画播放中禁止操作
  var score = 0, chainCount = 0;
  var boardEl = document.getElementById('board');

  function delay(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

  function newGame() {
    // 随机生成棋盘，但要保证初始状态没有现成的三消
    do {
      grid = [];
      for (var r = 0; r < N; r++) {
        var row = [];
        for (var c = 0; c < N; c++) row.push(Math.floor(Math.random() * KINDS));
        grid.push(row);
      }
    } while (findMatches().size > 0);
    score = 0; chainCount = 0;
    selected = null;
    updateUI();
    render();
  }

  function updateUI() {
    document.getElementById('score').textContent = score;
    document.getElementById('chain').textContent = chainCount;
  }

  function render() {
    boardEl.innerHTML = '';
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var d = document.createElement('div');
        d.className = 'gem c' + grid[r][c];
        if (selected && selected.r === r && selected.c === c) d.classList.add('sel');
        d.setAttribute('data-r', r);
        d.setAttribute('data-c', c);
        d.addEventListener('click', function () {
          tap(parseInt(this.getAttribute('data-r'), 10),
              parseInt(this.getAttribute('data-c'), 10));
        });
        boardEl.appendChild(d);
      }
    }
  }

  // 找出所有应该被消除的格子：横/竖连续 3 个以上同色
  function findMatches() {
    var set = {};
    function add(r, c) { set[r + '_' + c] = true; }

    // 横向
    for (var r = 0; r < N; r++) {
      var run = 1;
      for (var c = 1; c <= N; c++) {
        if (c < N && grid[r][c] !== null && grid[r][c] === grid[r][c-1]) {
          run++;
        } else {
          if (run >= 3) for (var k = c - run; k < c; k++) add(r, k);
          run = 1;
        }
      }
    }
    // 纵向
    for (var c2 = 0; c2 < N; c2++) {
      var run2 = 1;
      for (var r2 = 1; r2 <= N; r2++) {
        if (r2 < N && grid[r2][c2] !== null && grid[r2][c2] === grid[r2-1][c2]) {
          run2++;
        } else {
          if (run2 >= 3) for (var k2 = r2 - run2; k2 < r2; k2++) add(k2, c2);
          run2 = 1;
        }
      }
    }
    return { size: Object.keys(set).length, set: set };
  }

  async function tap(r, c) {
    if (busy) return;

    if (!selected) {
      selected = { r: r, c: c };
      render();
      return;
    }

    // 再点同一个格子：取消选择
    if (selected.r === r && selected.c === c) {
      selected = null;
      render();
      return;
    }

    // 必须是上下左右相邻
    var dist = Math.abs(selected.r - r) + Math.abs(selected.c - c);
    if (dist !== 1) {
      selected = { r: r, c: c };
      render();
      return;
    }

    // 尝试交换
    busy = true;
    swap(selected.r, selected.c, r, c);
    render();
    await delay(180);

    if (findMatches().size > 0) {
      selected = null;
      chainCount = 0;
      await resolve();
    } else {
      // 没有消除就换回去
      swap(selected.r, selected.c, r, c);
      selected = null;
      render();
    }
    busy = false;
  }

  function swap(r1, c1, r2, c2) {
    var t = grid[r1][c1];
    grid[r1][c1] = grid[r2][c2];
    grid[r2][c2] = t;
  }

  // 消除 → 下落 → 补充，循环到没有新的消除为止（含连锁）
  async function resolve() {
    while (true) {
      var m = findMatches();
      if (m.size === 0) break;

      chainCount++;
      score += m.size * 10 * chainCount;   // 连锁倍数得分
      updateUI();

      // 播放缩小消失动画后清空
      Object.keys(m.set).forEach(function (key) {
        var parts = key.split('_');
        var r = +parts[0], c = +parts[1];
        var index = r * N + c;
        var el = boardEl.children[index];
        if (el) el.classList.add('pop');
      });
      await delay(260);

      Object.keys(m.set).forEach(function (key) {
        var parts = key.split('_');
        grid[+parts[0]][+parts[1]] = null;
      });

      // 每一列：去掉空格，上面的掉下来，顶部补新宝石
      for (var c = 0; c < N; c++) {
        var col = [];
        for (var r = N - 1; r >= 0; r--) {
          if (grid[r][c] !== null) col.push(grid[r][c]);
        }
        for (var r2 = N - 1; r2 >= 0; r2--) {
          grid[r2][c] = col.length ? col.shift() : Math.floor(Math.random() * KINDS);
        }
      }
      render();
      await delay(220);
    }
    chainCount = 0;
    updateUI();
  }

  newGame();
<\/script>
</body>
</html>`

  grid.appendChild(card);
});

var player = document.getElementById('player');
var frame = document.getElementById('frame');
var playerTitle = document.getElementById('playerTitle');

// 打开游戏：把游戏完整 HTML 放进 iframe，并显示全屏容器
function openGame(i) {
  var g = GAMES[i];
  playerTitle.textContent = g.icon + ' ' + g.title;
  frame.srcdoc = g.html;
  player.classList.remove('hidden');
  document.body.style.overflow = 'hidden';  // 背景页面不滚动
}

// 返回列表：清空 iframe（停止游戏里的定时器），隐藏容器
function closeGame() {
  player.classList.add('hidden');
  frame.srcdoc = '';
  document.body.style.overflow = '';
}

document.getElementById('backBtn').addEventListener('click', closeGame);

// ESC 键也可以返回列表
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !player.classList.contains('hidden')) closeGame();
});
